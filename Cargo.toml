[workspace]
members = [
    "crates/app-foundation-contracts",
    "crates/app-foundation-data-plane",
    "crates/workbench-contract",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"
authors = ["Christopher Lester <christopher@miniforge.ai>"]
repository = "https://github.com/miniforge-ai/miniforge-app-foundation"

# Centralized per miniforge-standards languages/rust (230).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.4", features = ["util"] }
miniforge-app-foundation-contracts = { path = "crates/app-foundation-contracts" }
